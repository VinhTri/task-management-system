server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartpending_demo}
    username: ${DB_USERNAME:smartspend}
    password: ${DB_PASSWORD:smartspend}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

smartspend:
  storage:
    avatar-directory: ${AVATAR_DIRECTORY:./data/avatars}
  auth:
    jwt-secret-base64: ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    hmac-pepper: ${AUTH_HMAC_PEPPER:dev-only-change-this-long-random-secret}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    registration-token-ttl: 10m
    reset-token-ttl: 10m
  otp:
    hmac-pepper: ${OTP_HMAC_PEPPER:${AUTH_HMAC_PEPPER:dev-only-change-this-long-random-secret}}
    ttl: 5m
    cooldown: 60s
    progressive-cooldown: 5m
    send-window: 15m
    max-attempts: 5
    max-sends-per-window: 3
    email-block-duration: 1h
    client-violation-window: 24h
    max-client-violations: 5
    client-block-duration: 24h
    mail-from: ${MAIL_FROM:no-reply@smartspend.local}
